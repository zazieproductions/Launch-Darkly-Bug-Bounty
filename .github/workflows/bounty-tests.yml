name: bounty-tests

# LaunchDarkly bounty recon runner.
#
# WHY results are COMMITTED BACK: the agent sandbox can reach github.com but NOT
# the hosts that serve Actions logs (results-receiver.actions.githubusercontent.com)
# or artifacts (*.blob.core.windows.net). Printing to the job log or uploading an
# artifact is therefore invisible to the agent. Committing ci-results/ to this
# branch is the only reliable channel back.
#
# Optional secrets (scripts skip gracefully when unset):
#   LD_TOKEN           - LaunchDarkly personal API token  (Part C authenticated reads)
#   LD_LOGIN_EMAIL     - burner login email               (Part B ldso/session tests)
#   LD_LOGIN_PASSWORD  - burner login password            (Part B ldso/session tests)
#   LD_ACCOUNT_ID      - OUR OWN account id (24-hex)      (internal-API ld-account header test)
#                       find it in /api/v2/caller-identity "_links.self.href" or any
#                       /api/v2/account/{id}/... URL — never someone else's account id

on:
  push:
    branches: ['arena/**', 'main']
    paths: ['.github/workflows/bounty-tests.yml', 'tools/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bounty-tests
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare results dir
        run: |
          echo "RESULTS=ci-results/run-${{ github.run_number }}" >> "$GITHUB_ENV"
          mkdir -p "ci-results/run-${{ github.run_number }}"

      - name: Route/header matrix + OpenAPI + bundle mining (unauth, read-only)
        env:
          CI_RESULTS_DIR: ${{ env.RESULTS }}
        run: bash tools/ci-route-matrix.sh

      - name: Internal-API probe (GET only; auth-flow/mutating paths excluded by design)
        env:
          CI_RESULTS_DIR: ${{ env.RESULTS }}
          LD_ACCOUNT_ID: ${{ secrets.LD_ACCOUNT_ID }}
        run: bash tools/ci-internal-probe.sh

      - name: F-002 live check - canonicalKey collision vs published secure-mode hash
        env:
          CI_RESULTS_DIR: ${{ env.RESULTS }}
        run: bash tools/ci-securemode-collision.sh

      - name: F-002 local PoC - canonicalKey collisions in the real SDK code
        run: |
          [ -d sdk/node-server-sdk ] || git clone --depth 1 -q https://github.com/launchdarkly/node-server-sdk sdk/node-server-sdk
          node tools/poc-canonicalkey-collision.js "$RESULTS/F-002-poc"
          [ -d sdk/python-server-sdk ] || git clone --depth 1 -q https://github.com/launchdarkly/python-server-sdk sdk/python-server-sdk
          python3 tools/poc-canonicalkey-collision.py "$RESULTS/F-002-poc"

      - name: F-003 local PoC - private-attribute unescape bug (real js-core TS vs real node-server-sdk)
        run: |
          [ -d sdk/js-core ] || git clone --depth 1 -q https://github.com/launchdarkly/js-core sdk/js-core
          [ -d sdk/node-server-sdk ] || git clone --depth 1 -q https://github.com/launchdarkly/node-server-sdk sdk/node-server-sdk
          node tools/poc-private-attr-unescape.mjs "$RESULTS/F-003-poc"

      - name: Authenticated phase (INERT unless the LD_TOKEN secret exists)
        env:
          CI_RESULTS_DIR: ${{ env.RESULTS }}
          LD_TOKEN: ${{ secrets.LD_TOKEN }}
          LD_TOKEN_SCOPED: ${{ secrets.LD_TOKEN_SCOPED }}
          LD_ACCOUNT_ID: ${{ secrets.LD_ACCOUNT_ID }}
          LD_SSRF_CAPTOR: ${{ secrets.LD_SSRF_CAPTOR }}
          LD_ALLOW_RESOURCE_CREATION: ${{ secrets.LD_ALLOW_RESOURCE_CREATION }}
          LD_ALLOW_ENV_PATCH: ${{ secrets.LD_ALLOW_ENV_PATCH }}
          LD_ALLOW_LOGIN: ${{ secrets.LD_ALLOW_LOGIN }}
          LD_ALLOW_ORG_VERIFICATION: ${{ secrets.LD_ALLOW_ORG_VERIFICATION }}
          LD_LOGIN_EMAIL: ${{ secrets.LD_LOGIN_EMAIL }}
          LD_LOGIN_PASSWORD: ${{ secrets.LD_LOGIN_PASSWORD }}
        run: bash tools/ci-authenticated-phase.sh

      - name: X - extra unauth recon (CORS echo, preflight, root probes)
        run: bash tools/ci-extra-unauth.sh

      - name: A + C - session1 runner (Part C only when LD_TOKEN secret exists)
        env:
          LD_TOKEN: ${{ secrets.LD_TOKEN }}
        run: bash tools/run-session1.sh

      - name: B - ldso session tests (only when login secrets exist)
        env:
          LD_LOGIN_EMAIL: ${{ secrets.LD_LOGIN_EMAIL }}
          LD_LOGIN_PASSWORD: ${{ secrets.LD_LOGIN_PASSWORD }}
        run: bash tools/part-b-session.sh

      - name: Collect scratch outputs into results dir (bounded)
        if: always()
        run: |
          set -x
          mkdir -p "$RESULTS/scratch"
          # copy text-ish outputs only, skip bundles and anything huge
          find scratch -type f \( -name '*.txt' -o -name '*.json' -o -name '*.html' \) \
               -size -512k -not -path '*bundles*' -print0 2>/dev/null \
            | while IFS= read -r -d '' f; do
                cp --parents "$f" "$RESULTS/scratch/" 2>/dev/null || true
              done
          du -sh "$RESULTS" || true
          find "$RESULTS" -type f | wc -l

      - name: Redact any session material before committing
        if: always()
        run: |
          grep -rlE 'ldso=[A-Za-z0-9%._-]{8,}' "$RESULTS" 2>/dev/null | while read -r f; do
            sed -i -E 's/(ldso=)[A-Za-z0-9%._-]+/\1<redacted>/g' "$f"
          done
          # never commit a token-looking value
          grep -rlE '\b(api-[0-9a-f]{8}-[0-9a-f-]{20,}|lpat_[A-Za-z0-9]+|sdk-[0-9a-f-]{20,}|mob-[0-9a-f-]{20,})\b' "$RESULTS" 2>/dev/null \
            | while read -r f; do
                sed -i -E 's/\b(api-[0-9a-f]{8}-[0-9a-f-]{20,}|lpat_[A-Za-z0-9]+|sdk-[0-9a-f-]{20,}|mob-[0-9a-f-]{20,})\b/<redacted-key>/g' "$f"
              done
          echo "redaction pass complete"

      - name: Commit results back to this branch
        if: always()
        run: |
          git config user.name  "ld-bounty-ci"
          git config user.email "ld-bounty-ci@users.noreply.github.com"
          git add "$RESULTS"
          if git diff --cached --quiet; then
            echo "no result changes to commit"
          else
            git commit -m "ci(results): unauth route/header matrix, run ${{ github.run_number }}"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push origin "HEAD:$GITHUB_REF_NAME" || echo "PUSH FAILED (check contents:write permission)"
          fi

      - name: Upload responses artifact (best effort; sandbox cannot fetch it)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responses-${{ github.run_number }}
          path: ${{ env.RESULTS }}
          retention-days: 14
          if-no-files-found: ignore
